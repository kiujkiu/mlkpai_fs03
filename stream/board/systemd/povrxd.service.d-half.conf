# povrxd.service drop-in —— 半屏 3-bit 模式的启动参数
#   部署: sudo cp 到 /etc/systemd/system/povrxd.service.d/half.conf && daemon-reload
#
# 🔴 为什么必须有这个文件 (2026-08-24 差点漏掉):
#   pov_rxd 每帧翻页都会重申 0x0C sub01 (bcm_apply), 用的是它**自己**的
#   OE_W1/W2_DEFAULT 和 g_half_scan。所以 pov_boot.sh 在开机时设的半屏权重
#   和 half_scan 位, 会被 pov_rxd 的第一次翻页当场冲掉 —— 除非这两个值
#   通过命令行传给它。
#   ⇒ pov_boot.sh 的 (OE_W1,OE_W2,HALF) 和这里的 (--oe-w, --half-scan)
#     **是同一组配置的两半, 必须一起改**。tools/test_idle_anim_3bit.py 会对账。
#
#   半屏权重为什么是 28/14 而不是 92/46: 半屏行周期只有 99 拍, oe 上限从 111
#   掉到 57 (那个 111 来自"OE 收完还要等行驱推进 80 拍"), 整组按 4:2:1 缩到
#   57/28/14。oe_w0=57 由 pov_boot.sh 走 sub10 写。
[Service]
ExecStart=
ExecStart=/home/uisrc/pov_rxd --idle-anim /home/uisrc/anim.pvs --idle-fps 11 --half-scan --oe-w 28,14
