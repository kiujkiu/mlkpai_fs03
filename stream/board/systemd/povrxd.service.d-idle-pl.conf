# povrxd drop-in: 上电空闲动画 + PL 硬件 lz4 解码 (3 引擎)
#
# 装法: sudo cp 到 /etc/systemd/system/povrxd.service.d/idle.conf
#       sudo systemctl daemon-reload && sudo systemctl restart povrxd
#
# 🔴 --no-pipeline 不是"退化选项", 是 2026-08-25 实测选出来的默认。
#    969 RPM (16.15 rev/s) + fold_a 下的 A/B 对照:
#
#      流水线   rx 15-17/s   flip 4-8/s    drop 1600   ⇒ 实际上屏 4-8 fps
#      串行     rx 10-12/s   flip 10-12/s  drop 9      ⇒ 实际上屏 10-12 fps
#
#    流水线把 settle 推迟到"收到下一帧", 于是帧就绪的节奏被 WiFi recv 拖着走,
#    与 62ms 的翻页窗**失去同步** —— 收得更快, 上屏反而更少。
#    串行下解码完立刻去等窗口, 节奏天然跟着转速走, flip == rx 一帧不丢。
#
#    ⚠ 这个结论只在"解码比一圈快"时成立。当初做流水线是因为解码 74ms 慢于
#    链路, 要把 55-80ms 的 recv 藏起来; fold_a 把解码压到 55.5ms 之后,
#    藏 recv 的收益已经小于失去窗口同步的代价。**解码若再变慢就要重新评估。**
[Service]
ExecStart=
ExecStart=/home/uisrc/pov_rxd --idle-anim /home/uisrc/helix3b.pvs --idle-fps 11 --pl-lz4 --pl-engines 3 --no-pipeline
